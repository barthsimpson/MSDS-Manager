[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msds-manager"
version = "0.1.0"
description = "MSDS Manager bootstrap project"
dependencies = [
    "SQLAlchemy>=2,<3",
    "alembic",
    "psycopg",
    "pytest",
    "streamlit",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp -p no:cacheprovider"
